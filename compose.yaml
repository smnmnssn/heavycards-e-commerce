# Local development database only. Never use these credentials elsewhere.
#
#   docker compose up -d        start PostgreSQL
#   docker compose down         stop (data is kept in the named volume)
#   docker compose down -v      stop and delete all local data
#
# Creates `heavycards` (development) and `heavycards_test` (automated tests).
services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heavycards
      POSTGRES_PASSWORD: heavycards
      POSTGRES_DB: heavycards
    ports:
      # Loopback only, so the database is not reachable from the network.
      # Non-default host port avoids clashing with other local PostgreSQL servers.
      - "127.0.0.1:54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heavycards -d heavycards"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
